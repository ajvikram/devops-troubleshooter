name: e2e

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kit contract
        run: chmod +x tests/kit.sh tests/e2e.sh scripts/init.sh scripts/setup.sh && ./tests/kit.sh

  kit-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kit contract
        run: chmod +x tests/kit.sh scripts/init.sh && ./tests/kit.sh

  kit-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kit contract
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\tests\kit.ps1

  cluster:
    runs-on: ubuntu-latest
    needs: kit
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1.10.0
        with:
          cluster_name: dto-e2e
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Cluster + MCP e2e
        run: |
          chmod +x tests/kit.sh tests/e2e.sh scripts/init.sh scripts/setup.sh
          ./tests/e2e.sh --use-current-kubeconfig
