# ResourceQuota already exhausted by crashloop + not-ready + mismatch (3 pods).
# Applied by e2e AFTER those three exist. Fourth workload stays Pending.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tiny
  namespace: dto-e2e
  labels:
    dto-e2e: saturation
spec:
  hard:
    pods: "3"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pending-quota
  namespace: dto-e2e
  labels:
    app: pending-quota
    dto-e2e: saturation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pending-quota
  template:
    metadata:
      labels:
        app: pending-quota
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["/bin/sleep", "3600"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 20m
              memory: 16Mi
