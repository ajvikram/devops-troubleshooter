# Unreachable: pods Ready, Service selector does not match → empty Endpoints.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mismatch
  namespace: dto-e2e
  labels:
    app: mismatch
    dto-e2e: mismatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["/bin/sleep", "3600"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 20m
              memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mismatch
  namespace: dto-e2e
spec:
  selector:
    app: payments
  ports:
    - port: 80
      targetPort: 80
