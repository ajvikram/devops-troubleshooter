# Crash class: container exits immediately. Logs carry a known RCA string.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop
  namespace: dto-e2e
  labels:
    app: crashloop
    dto-e2e: crash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashloop
  template:
    metadata:
      labels:
        app: crashloop
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - 'echo CONFIG_ERROR: missing PAYMENTS_DSN; sleep 1; exit 1'
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: crashloop
  namespace: dto-e2e
spec:
  selector:
    app: crashloop
  ports:
    - port: 80
      targetPort: 80
